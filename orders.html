<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سفارش‌های من | مقایسه‌چی</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #f5f7fb;
      color: #1f2937;
    }

    header {
      background: #2563eb;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    .container {
      width: 100%;
      max-width: 850px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 20px;
    }

    .button {
      border: 0;
      border-radius: 10px;
      padding: 12px 16px;
      cursor: pointer;
      text-decoration: none;
      font-size: 14px;
    }

    .primary {
      background: #2563eb;
      color: white;
    }

    .secondary {
      background: #e5e7eb;
      color: #111827;
    }

    .order {
      background: white;
      border-radius: 16px;
      margin-bottom: 18px;
      padding: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,.06);
    }

    .order-header {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      border-bottom: 1px solid #e5e7eb;
      padding-bottom: 14px;
      margin-bottom: 15px;
    }

    .order-id {
      font-size: 12px;
      color: #6b7280;
      word-break: break-all;
      margin-top: 5px;
    }

    .status {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 12px;
      white-space: nowrap;
    }

    .paid {
      background: #dcfce7;
      color: #166534;
    }

    .pending {
      background: #fef3c7;
      color: #92400e;
    }

    .failed {
      background: #fee2e2;
      color: #991b1b;
    }

    .unknown {
      background: #e5e7eb;
      color: #374151;
    }

    .info {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 15px;
    }

    .info div {
      background: #f8fafc;
      padding: 10px;
      border-radius: 9px;
      font-size: 13px;
    }

    .items {
      margin-top: 15px;
    }

    .item {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid #eee;
      font-size: 13px;
    }

    .total {
      display: flex;
      justify-content: space-between;
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid #eee;
      font-weight: bold;
      font-size: 16px;
    }

    .state {
      background: white;
      border-radius: 16px;
      padding: 30px 20px;
      text-align: center;
      box-shadow: 0 5px 20px rgba(0,0,0,.06);
      margin-bottom: 18px;
    }

    .error {
      color: #991b1b;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 600px) {
      .toolbar,
      .order-header {
        flex-direction: column;
      }

      .info {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>📦 سفارش‌های من</h1>
</header>

<main class="container">

  <div class="toolbar">

    <a
      class="button secondary"
      href="index.html"
    >
      ← بازگشت به فروشگاه
    </a>

    <button
      id="refreshButton"
      class="button primary"
      type="button"
    >
      🔄 بروزرسانی
    </button>

  </div>


  <div
    id="loading"
    class="state"
  >
    ⏳ در حال دریافت سفارش‌ها...
  </div>


  <div
    id="error"
    class="state error hidden"
  ></div>


  <div
    id="empty"
    class="state hidden"
  >

    <h2>
      📦 هنوز سفارشی ندارید
    </h2>

    <p>
      می‌توانید خرید خود را از مقایسه‌چی شروع کنید.
    </p>

    <a
      class="button primary"
      href="index.html"
    >
      مشاهده محصولات
    </a>

  </div>


  <div id="orders"></div>

</main>


<script>

const SUPABASE_URL =
  "https://evvdggckoalesyyyqhqm.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_fkx37LxzP3Lb1q2HNxsoKw_6oTDNLUl";


const loading =
  document.getElementById("loading");

const errorBox =
  document.getElementById("error");

const emptyBox =
  document.getElementById("empty");

const ordersBox =
  document.getElementById("orders");

const refreshButton =
  document.getElementById("refreshButton");


function escapeHTML(value) {

  return String(value ?? "-")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


function formatMoney(value) {

  return Number(value || 0)
    .toLocaleString("fa-IR")
    + " تومان";

}


function getStatus(status) {

  const statuses = {

    paid: [
      "پرداخت شده",
      "paid"
    ],

    pending: [
      "در انتظار پرداخت",
      "pending"
    ],

    processing: [
      "در حال پردازش",
      "pending"
    ],

    cancelled: [
      "لغو شده",
      "failed"
    ],

    failed: [
      "پرداخت ناموفق",
      "failed"
    ]

  };

  return statuses[status] ||
    [
      "نامشخص",
      "unknown"
    ];

}


async function refreshSession() {

  const refreshToken =
    localStorage.getItem(
      "supabase_refresh_token"
    );


  if (!refreshToken) {

    return false;

  }


  try {

    const response =
      await fetch(
        SUPABASE_URL +
        "/auth/v1/token?grant_type=refresh_token",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json",

            "apikey":
              SUPABASE_KEY
          },

          body: JSON.stringify({
            refresh_token:
              refreshToken
          })
        }
      );


    const data =
      await response.json();


    if (
      !response.ok ||
      !data.access_token
    ) {

      return false;

    }


    localStorage.setItem(
      "supabase_access_token",
      data.access_token
    );


    if (data.refresh_token) {

      localStorage.setItem(
        "supabase_refresh_token",
        data.refresh_token
      );

    }


    return true;

  } catch (error) {

    console.error(
      "Refresh error:",
      error
    );

    return false;

  }

}


async function requestOrders() {

  let accessToken =
    localStorage.getItem(
      "supabase_access_token"
    );


  if (!accessToken) {

    const refreshed =
      await refreshSession();


    if (!refreshed) {

      throw new Error(
        "ابتدا وارد حساب کاربری شوید."
      );

    }


    accessToken =
      localStorage.getItem(
        "supabase_access_token"
      );

  }


  let response =
    await fetch(
      SUPABASE_URL +
      "/functions/v1/my-orders",
      {
        method: "GET",

        headers: {
          "Authorization":
            "Bearer " + accessToken,

          "apikey":
            SUPABASE_KEY
        }
      }
    );


  /*
   * اگر Access Token منقضی شده باشد،
   * Refresh و سپس درخواست مجدد.
   */

  if (response.status === 401) {

    const refreshed =
      await refreshSession();


    if (!refreshed) {

      throw new Error(
        "نشست شما منقضی شده است. دوباره وارد شوید."
      );

    }


    accessToken =
      localStorage.getItem(
        "supabase_access_token"
      );


    response =
      await fetch(
        SUPABASE_URL +
        "/functions/v1/my-orders",
        {
          method: "GET",

          headers: {
            "Authorization":
              "Bearer " + accessToken,

            "apikey":
              SUPABASE_KEY
          }
        }
      );

  }


  const data =
    await response.json();


  if (!response.ok) {

    throw new Error(
      data.error ||
      data.message ||
      "خطا در دریافت سفارش‌ها"
    );

  }


  return data.orders || [];

}


function renderOrders(orders) {

  loading.classList.add(
    "hidden"
  );


  if (!orders.length) {

    emptyBox.classList.remove(
      "hidden"
    );

    return;

  }


  ordersBox.innerHTML =
    orders.map(order => {

      const status =
        getStatus(
          order.status
        );


      const date =
        order.created_at
          ? new Date(
              order.created_at
            ).toLocaleString("fa-IR")
          : "-";


      const items =
        order.order_items ||
        order.items ||
        [];


      const itemsHTML =
        items.map(item => {

          const quantity =
            Number(
              item.quantity || 1
            );


          const itemPrice =
            item.subtotal ??
            (
              Number(
                item.unit_price ||
                item.price ||
                0
              ) * quantity
            );


          return `
            <div class="item">

              <span>
                ${escapeHTML(
                  item.product_name ||
                  item.name ||
                  "محصول"
                )}

                ×
                ${quantity.toLocaleString(
                  "fa-IR"
                )}
              </span>

              <strong>
                ${formatMoney(
                  itemPrice
                )}
              </strong>

            </div>
          `;

        }).join("");


      return `
        <article class="order">

          <div class="order-header">

            <div>

              <strong>
                📦 سفارش
              </strong>

              <div class="order-id">
                ${escapeHTML(
                  order.id
                )}
              </div>

            </div>


            <span
              class="status ${status[1]}"
            >
              ${status[0]}
            </span>

          </div>


          <div class="info">

            <div>
              📅 تاریخ:
              <strong>
                ${escapeHTML(
                  date
                )}
              </strong>
            </div>

            <div>
              💳 وضعیت:
              <strong>
                ${status[0]}
              </strong>
            </div>

          </div>


          <div class="items">

            ${
              itemsHTML ||
              "<p>جزئیات محصولات ثبت نشده است.</p>"
            }

          </div>


          <div class="total">

            <span>
              مبلغ کل
            </span>

            <strong>
              ${formatMoney(
                order.total_amount
              )}
            </strong>

          </div>

        </article>
      `;

    }).join("");

}


async function loadOrders() {

  loading.classList.remove(
    "hidden"
  );

  errorBox.classList.add(
    "hidden"
  );

  emptyBox.classList.add(
    "hidden"
  );

  ordersBox.innerHTML = "";


  try {

    const orders =
      await requestOrders();


    renderOrders(
      orders
    );


  } catch (error) {

    console.error(error);

    loading.classList.add(
      "hidden"
    );

    errorBox.textContent =
      "❌ دریافت سفارش‌ها انجام نشد: " +
      error.message;

    errorBox.classList.remove(
      "hidden"
    );

  }

}


refreshButton.addEventListener(
  "click",
  loadOrders
);


loadOrders();

</script>

</body>
</html>
