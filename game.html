<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>🎮 سکه‌چی</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 16px;
      font-family: Tahoma, Arial, sans-serif;
      background: linear-gradient(135deg, #f6d365, #fda085);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .game {
      width: 100%;
      max-width: 520px;
    }

    .back {
      display: block;
      margin-bottom: 12px;
      color: #111827;
      text-decoration: none;
      font-weight: bold;
    }

    .card {
      background: #fff;
      border-radius: 24px;
      padding: 24px 16px;
      text-align: center;
      box-shadow: 0 12px 35px rgba(0,0,0,.18);
    }

    h1 {
      margin: 5px 0 20px;
      font-size: 30px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 15px;
    }

    .stat {
      background: #f3f4f6;
      border-radius: 14px;
      padding: 12px 4px;
      font-weight: bold;
    }

    .stat span {
      display: inline-block;
      margin-top: 5px;
      font-size: 18px;
    }

    .target {
      width: min(55vw, 180px);
      height: min(55vw, 180px);
      min-width: 145px;
      min-height: 145px;
      max-width: 180px;
      max-height: 180px;

      display: block;
      margin: 25px auto;

      border: 0;
      border-radius: 50%;
      background: #ffd43b;
      box-shadow: 0 8px 0 #d9a900;

      font-size: 68px;
      cursor: pointer;
      touch-action: manipulation;
      user-select: none;
    }

    .target:active {
      transform: translateY(5px);
      box-shadow: 0 3px 0 #d9a900;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }

    .buttons button {
      width: 100%;
      min-height: 56px;
      border: 0;
      border-radius: 14px;
      padding: 14px 18px;
      font-family: inherit;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      touch-action: manipulation;
    }

    #startButton {
      background: #111827;
      color: white;
    }

    #saveButton {
      background: #16a34a;
      color: white;
    }

    .buttons button:active {
      transform: scale(.98);
    }

    .buttons button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    #gameMessage {
      min-height: 30px;
      margin-top: 18px;
      font-size: 15px;
      font-weight: bold;
    }

    @media (min-width: 600px) {
      .buttons {
        flex-direction: row;
      }

      .buttons button {
        flex: 1;
      }
    }
  </style>
</head>

<body>

  <main class="game">

    <a class="back" href="index.html">
      ← بازگشت به مقایسه‌چی
    </a>

    <section class="card">

      <h1>🎮 سکه‌چی</h1>

      <div class="stats">

        <div class="stat">
          🪙
          <br>
          <span id="coins">0</span>
        </div>

        <div class="stat">
          ⚡
          <br>
          <span id="energy">20</span>
        </div>

        <div class="stat">
          🎯
          <br>
          <span id="score">0</span>
        </div>

      </div>

      <p>
        روی هدف بزن و امتیاز بگیر.
      </p>

      <button
        id="target"
        class="target"
        type="button"
        disabled
      >
        🎯
      </button>

      <div class="buttons">

        <button
          id="startButton"
          type="button"
        >
          🎮 شروع بازی
        </button>

        <button
          id="saveButton"
          type="button"
          disabled
        >
          💾 پایان و دریافت سکه
        </button>

      </div>

      <div id="gameMessage">
        🎮 آماده بازی
      </div>

    </section>

  </main>


<script>
"use strict";

const SUPABASE_URL =
  "https://evvdggckoalesyyyqhqm.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_fkx37LxzP3Lb1q2HNxsoKw_6oTDNLUl";

const GAME_URL =
  `${SUPABASE_URL}/functions/v1/sekkechi-game-v2`;


let score = 0;
let coins = 0;
let playing = false;


const startButton =
  document.getElementById("startButton");

const saveButton =
  document.getElementById("saveButton");

const target =
  document.getElementById("target");

const scoreEl =
  document.getElementById("score");

const coinsEl =
  document.getElementById("coins");

const message =
  document.getElementById("gameMessage");


// -----------------------------
// گرفتن توکن ورود کاربر
// -----------------------------

function getAccessToken() {

  return localStorage.getItem(
    "supabase_access_token"
  );

}


// -----------------------------
// دریافت موجودی از Supabase
// -----------------------------

async function loadGameData() {

  const token =
    getAccessToken();

  if (!token) {

    message.textContent =
      "⚠️ برای ذخیره سکه ابتدا وارد حساب شوید.";

    return;
  }

  try {

    const response =
      await fetch(
        GAME_URL,
        {
          method: "GET",

          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization":
              `Bearer ${token}`
          }
        }
      );


    const result =
      await response.json();


    if (!response.ok || !result.ok) {

      throw new Error(
        result.error ||
        "دریافت اطلاعات بازی انجام نشد"
      );

    }


    coins =
      Number(result.coin_balance || 0);

    coinsEl.textContent =
      coins.toLocaleString("fa-IR");


  } catch (error) {

    console.error(error);

    message.textContent =
      "⚠️ موجودی سکه دریافت نشد.";

  }

}


// -----------------------------
// شروع بازی
// -----------------------------

startButton.addEventListener(
  "click",
  function () {

    score = 0;

    playing = true;

    scoreEl.textContent = "0";

    target.disabled = false;

    saveButton.disabled = false;

    startButton.disabled = true;

    message.textContent =
      "🎯 بازی شروع شد! حالا روی هدف بزن.";

  }
);


// -----------------------------
// زدن هدف
// -----------------------------

target.addEventListener(
  "click",
  function () {

    if (!playing) {
      return;
    }

    score++;

    scoreEl.textContent =
      score.toLocaleString("fa-IR");

  }
);


// -----------------------------
// پایان و ذخیره بازی
// -----------------------------

saveButton.addEventListener(
  "click",
  async function () {

    if (score <= 0) {

      message.textContent =
        "🎯 اول روی هدف بزن و امتیاز بگیر.";

      return;
    }


    const token =
      getAccessToken();


    if (!token) {

      message.textContent =
        "❌ ابتدا وارد حساب کاربری شوید.";

      return;
    }


    playing = false;

    target.disabled = true;

    saveButton.disabled = true;

    message.textContent =
      "⏳ در حال ذخیره بازی...";


    try {

      const response =
        await fetch(
          GAME_URL,
          {
            method: "POST",

            headers: {

              "Content-Type":
                "application/json",

              "apikey":
                SUPABASE_KEY,

              "Authorization":
                `Bearer ${token}`

            },

            body: JSON.stringify({
              score: score
            })

          }
        );


      const result =
        await response.json();


      if (!response.ok || !result.ok) {

        throw new Error(
          result.error ||
          "ذخیره بازی انجام نشد"
        );

      }


      // موجودی واقعی Supabase

      coins =
        Number(result.coin_balance || 0);

      coinsEl.textContent =
        coins.toLocaleString("fa-IR");


      message.textContent =
        "✅ بازی ذخیره شد | +" +
        Number(result.coins_earned || 0)
          .toLocaleString("fa-IR") +
        " 🪙 سکه | سطح " +
        Number(result.level || 1);


      score = 0;

      scoreEl.textContent = "0";

      startButton.disabled = false;


    } catch (error) {

      console.error(error);

      playing = false;

      target.disabled = true;

      saveButton.disabled = false;

      startButton.disabled = false;

      message.textContent =
        "❌ " +
        (
          error.message ||
          "خطا در ذخیره بازی"
        );

    }

  }
);


// -----------------------------
// بارگذاری موجودی هنگام ورود
// -----------------------------

loadGameData();

  </script>

</body>
</html>
